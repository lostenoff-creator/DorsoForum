<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DorsoForum</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--wall:#1c1512;--panel:#261c17;--panel2:#2f231c;--line:#4a3626;--text:#eadfca;--dim:#a8977c;--brass:#c39a4b;--velvet:#8a2a30}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:17px/1.65 Lora,Georgia,serif;background:var(--wall) repeating-linear-gradient(90deg,transparent 0 38px,rgba(195,154,75,.045) 38px 40px)}
a{color:var(--brass)}
h1,h2,h3,.logo{font-family:"IM Fell English",Georgia,serif;font-weight:400;line-height:1.2}
h1{font-size:40px;margin:0 0 6px}h2{font-size:28px;margin:34px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
header{position:sticky;top:0;z-index:5;background:rgba(38,28,23,.96);border-bottom:3px double var(--line);backdrop-filter:blur(6px)}
.bar{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.logo{font-size:28px;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:10px}
.logo svg{width:26px;height:34px}
nav{display:flex;gap:16px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--text);padding:4px 0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{color:var(--brass);border-color:var(--brass)}
.right{margin-left:auto;display:flex;gap:10px;align-items:center}
#q{background:var(--wall);border:1px solid var(--line);color:var(--text);padding:7px 12px;font:inherit;width:190px}
main{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
.lead{color:var(--dim);margin:0 0 22px}
button,.btn{background:var(--brass);color:#1c1512;border:0;padding:9px 18px;font:600 15px Lora,serif;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{filter:brightness(1.1)}
button.ghost{background:none;color:var(--brass);border:1px solid var(--brass)}
input,textarea,select{width:100%;background:var(--wall);border:1px solid var(--line);color:var(--text);padding:9px 12px;font:inherit;margin:4px 0 10px}
textarea{min-height:110px}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.layout{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start}
.box{border:1px solid var(--line);background:var(--panel);padding:16px;margin-bottom:18px}
.box h3{margin:0 0 10px;font-size:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);padding:4px 14px;text-decoration:none;color:var(--text);background:var(--panel);font-size:15px}
.chip.on,.chip:hover{border-color:var(--brass);color:var(--brass)}
.post{display:grid;grid-template-columns:48px 1fr;gap:14px;text-decoration:none;color:var(--text);border:1px solid var(--line);background:var(--panel);padding:14px 16px;margin-bottom:10px;border-left:5px solid var(--velvet)}
.post:hover{border-color:var(--brass);background:var(--panel2)}
.ava{width:48px;height:48px;border-radius:50%;background:var(--velvet);border:2px solid var(--brass);display:grid;place-items:center;font:22px "IM Fell English",serif}
.post b{font:400 22px "IM Fell English",serif;display:block}
.post p{margin:2px 0 6px;color:var(--dim);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--dim);font-size:14px}
.tag{color:var(--brass);font-size:13px;border:1px solid var(--line);padding:0 8px;margin-right:6px}
.mini{display:grid;grid-template-columns:64px 1fr;gap:12px;text-decoration:none;color:var(--text);margin-bottom:12px;align-items:center}
.mini img{width:64px;height:48px;object-fit:cover;border:1px solid var(--line)}
.mini b{font:400 18px "IM Fell English",serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{display:block;border:1px solid var(--line);text-decoration:none;color:var(--text);background:var(--panel);overflow:hidden}
.card:hover{border-color:var(--brass)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-bottom:1px solid var(--line)}
.card div{padding:10px 14px 14px}
.card b{font:400 22px "IM Fell English",serif;display:block}
.card small{color:var(--dim);font-size:14px;line-height:1.4;display:block}
.hero{position:relative;border:1px solid var(--line);margin-bottom:22px;overflow:hidden}
.hero img{width:100%;height:240px;object-fit:cover;display:block;opacity:.75}
.hero div{position:absolute;inset:auto 0 0 0;padding:20px;background:linear-gradient(transparent,rgba(20,14,11,.95))}
.hero h1{margin:0}
.article{display:grid;grid-template-columns:1fr 280px;gap:30px;align-items:start}
.side{position:sticky;top:84px}
.infobox{border:1px solid var(--line);background:var(--panel);font-size:15px;margin-bottom:16px}
.infobox h3{margin:0;padding:8px 12px;background:var(--velvet);font-size:20px}
.infobox div{padding:6px 12px;border-top:1px solid var(--line)}
.infobox span{color:var(--dim);display:block;font-size:13px}
.toc a{display:block;text-decoration:none;color:var(--text);padding:3px 0 3px 12px;border-left:2px solid var(--line);font-size:15px}
.toc a:hover{border-color:var(--brass);color:var(--brass)}
.crumb{color:var(--dim);font-size:14px;margin-bottom:12px}
.cm{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:16px 0;white-space:pre-wrap}
.err{color:#e07a7a;margin:6px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
dialog{background:var(--panel);color:var(--text);border:2px solid var(--brass);padding:22px;max-width:380px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.65)}
@media(max-width:820px){.layout,.article{grid-template-columns:1fr}.side{position:static}#q{width:100%}.right{margin-left:0;width:100%}h1{font-size:32px}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#/"><svg viewBox="0 0 26 34"><path d="M2 32V13a11 11 0 0 1 22 0V32Z" fill="none" stroke="#c39a4b" stroke-width="2.5"/><circle cx="18" cy="20" r="1.8" fill="#c39a4b"/></svg>DorsoForum</a>
  <nav id="nav"></nav>
  <div class="right"><input id="q" type="search" placeholder="Поиск по вики…" aria-label="Поиск"><span id="acct"></span></div>
</div></header>
<main id="app"></main>

<dialog id="dlg"><h3 style="margin-top:0;font-size:26px">Вход на форум</h3>
 <input id="em" type="email" placeholder="Почта" autocomplete="email">
 <input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
 <input id="nm" placeholder="Имя на форуме (при регистрации)">
 <div class="row" style="justify-content:flex-start"><button id="in">Войти</button><button class="ghost" id="up">Регистрация</button><button class="ghost" id="cl" style="margin-left:auto">Закрыть</button></div>
 <p class="err" id="aerr"></p></dialog>

<script>
/* ===== 1. SUPABASE: впиши свои значения ===== */
const SUPABASE_URL = 'https://dmolqqylspruqsevxmui.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_KLd1KBZzCbS-ZkwEa_fv3g_sJeblZcn';

/* ===== 2. КОНТЕНТ ВИКИ =====
   img — необязательно: путь к своей картинке (например 'images/rush.jpg').
   Если картинки нет или она не загрузилась, рисуется заглушка-дверь.
   sec — разделы страницы: [заголовок, текст]. */
const FC = {general:'Общее', theories:'Теории', help:'Помощь', finds:'Находки'};
const CATS = {entities:'Сущности', items:'Предметы', updates:'Обновления', lore:'Лор'};
const DATA = [
 {id:'rush', cat:'entities', title:'Rush', img:'', short:'Быстрая сущность, проносится по коридорам.',
  info:{'Тип':'Сущность','Опасность':'Высокая','Спасение':'Шкаф или кровать'},
  sec:[['Описание','Rush проносится через несколько комнат подряд. О нём предупреждают мигание света и характерный звук.'],['Как пережить','Успей спрятаться в шкаф или под кровать до того, как сущность окажется рядом.'],['Заметки','Добавь сюда факты, советы и теории.']]},
 {id:'ambush', cat:'entities', title:'Ambush', img:'', short:'Возвращается несколько раз подряд.',
  info:{'Тип':'Сущность','Опасность':'Высокая','Спасение':'Прятаться, пока не кончатся проходы'},
  sec:[['Описание','Ambush похожа на Rush, но пролетает по коридору несколько раз.'],['Как пережить','Не выходи из укрытия после первого прохода.']]},
 {id:'seek', cat:'entities', title:'Seek', img:'', short:'Погоня с глазами на стенах.',
  info:{'Тип':'Сущность','Опасность':'Очень высокая','Спасение':'Бежать, не смотреть на глаза'},
  sec:[['Описание','Seek преследует игрока в особой погоне. На стенах появляются глаза.'],['Как пережить','Не смотри на глаза и обходи препятствия на пути.']]},
 {id:'figure', cat:'entities', title:'Figure', img:'', short:'Слепой хранитель библиотеки.',
  info:{'Тип':'Сущность','Опасность':'Очень высокая','Спасение':'Двигаться тихо'},
  sec:[['Описание','Figure живёт в библиотеке. Он слепой и реагирует на звук.'],['Как пережить','Двигайся тихо: шум привлекает его внимание.']]},
 {id:'flashlight', cat:'items', title:'Фонарик', img:'', short:'Освещает тёмные комнаты.',
  info:{'Тип':'Предмет','Где взять':'Начальный / находки'},
  sec:[['Описание','Помогает ориентироваться в темноте и искать предметы.'],['Использование','Работает на батарейках, которые со временем садятся.']]},
 {id:'lockpicks', cat:'items', title:'Отмычки', img:'', short:'Открывают запертые двери.',
  info:{'Тип':'Предмет','Где взять':'Комнаты и магазин','Одноразовый':'Да'},
  sec:[['Описание','Позволяют открыть запертую дверь без ключа.']]},
 {id:'update-example', cat:'updates', title:'Пример обновления', img:'', short:'Шаблон страницы об обновлении.',
  info:{'Дата':'укажи дату','Версия':'укажи версию'},
  sec:[['Новое','Опиши новые сущности, предметы и комнаты.'],['Изменения','Опиши баланс и исправления.']]},
 {id:'hotel', cat:'lore', title:'Отель', img:'', short:'Место действия игры.',
  info:{'Тип':'Локация'},
  sec:[['О месте','Игроки поднимаются по комнатам отеля, открывая двери одну за другой.'],['Теории','Собирай здесь записки, подсказки и связи между сущностями.']]}
];

/* ===== код ===== */
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d).toLocaleString('ru-RU');
const configured = !SUPABASE_URL.includes('YOUR-PROJECT');
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let user = null;
const nameOf = u => u.user_metadata?.name || u.email.split('@')[0];

function ph(a){ // заглушка-дверь
  const h = [...a.id].reduce((s,c) => s*31 + c.charCodeAt(0), 7) % 360;
  return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='hsl(${h},35%,24%)'/><stop offset='1' stop-color='hsl(${h},40%,8%)'/></linearGradient></defs><rect width='400' height='300' fill='url(#g)'/><path d='M150 250V100a50 50 0 0 1 100 0V250Z' fill='hsl(${h},30%,13%)' stroke='#c39a4b' stroke-width='4'/><circle cx='230' cy='170' r='6' fill='#c39a4b'/><text x='200' y='150' text-anchor='middle' font-family='Georgia,serif' font-size='54' fill='#eadfca'>${esc(a.title[0])}</text></svg>`);
}
const img = a => `<img loading="lazy" alt="${esc(a.title)}" src="${esc(a.img) || ph(a)}" onerror="this.onerror=null;this.src='${ph(a)}'">`;

$('#nav').innerHTML = '<a href="#/" data-h="#/">Форум</a><a href="#/wiki" data-h="#/wiki">Вики</a>' +
  Object.entries(CATS).map(([k,v]) => `<a href="#/cat/${k}" data-h="#/cat/${k}">${v}</a>`).join('');
$('#q').addEventListener('input', e => { const v = e.target.value.trim(); location.hash = v ? '#/search/' + encodeURIComponent(v) : '#/wiki'; });

/* ----- вход ----- */
const dlg = $('#dlg');
$('#cl').onclick = () => dlg.close();
const authGo = async fn => {
  const {error} = await fn($('#em').value.trim(), $('#pw').value, $('#nm').value.trim());
  if(error) $('#aerr').textContent = error.message; else if(user) dlg.close();
};
$('#in').onclick = () => sb ? authGo((email,password) => sb.auth.signInWithPassword({email,password})) : $('#aerr').textContent = 'Форум ещё не подключён к Supabase.';
$('#up').onclick = () => sb ? authGo(async (email,password,name) => {
  const r = await sb.auth.signUp({email,password,options:{data:{name:name || email.split('@')[0]}}});
  if(!r.error && !r.data.session) $('#aerr').textContent = 'Проверьте почту и подтвердите адрес.';
  return r;
}) : $('#aerr').textContent = 'Форум ещё не подключён к Supabase.';
function acct(){
  $('#acct').innerHTML = user ? `<span class="meta">${esc(nameOf(user))}</span> <button class="ghost" id="out">Выйти</button>` : '<button id="open">Войти</button>';
  $('#out')?.addEventListener('click', () => sb.auth.signOut());
  $('#open')?.addEventListener('click', () => dlg.showModal());
}
const needLogin = () => dlg.showModal();

/* ----- форум (главная) ----- */
const miniWiki = () => `<div class="box"><h3>Из вики</h3>${DATA.slice(0,4).map(a => `<a class="mini" href="#/w/${a.id}">${img(a)}<span><b>${esc(a.title)}</b><br><span class="meta">${esc(CATS[a.cat])}</span></span></a>`).join('')}<a href="#/wiki">Открыть вики</a></div>`;
const noSetup = '<div class="box">Форум не подключён. Впиши <b>SUPABASE_URL</b> и <b>SUPABASE_ANON_KEY</b> в начале <code>index.html</code>.</div>';

async function forum(cat){
  app.innerHTML = '<h1>DorsoForum</h1><p class="lead">Загрузка…</p>';
  let rows = [], err = '';
  if(configured){
    let q = sb.from('posts').select('id,title,body,author,category,created_at,comments(count)').order('created_at',{ascending:false});
    if(cat) q = q.eq('category', cat);
    const r = await q; rows = r.data || []; err = r.error?.message || '';
  }
  app.innerHTML = `<h1>DorsoForum</h1><p class="lead">Обсуждения, теории и находки по Doors.</p>
  <div class="layout"><div>
   <div class="row" style="margin-bottom:14px"><div class="chips" style="margin:0"><a class="chip ${cat?'':'on'}" href="#/">Все</a>${Object.entries(FC).map(([k,v]) => `<a class="chip ${cat===k?'on':''}" href="#/c/${k}">${v}</a>`).join('')}</div><button id="nt">Новая тема</button></div>
   <div class="box" id="form" hidden><h3>Новая тема</h3>
     <select id="pc">${Object.entries(FC).map(([k,v]) => `<option value="${k}" ${k===cat?'selected':''}>${v}</option>`).join('')}</select>
     <input id="pt" placeholder="Заголовок" maxlength="120"><textarea id="pb" placeholder="Текст" maxlength="5000"></textarea>
     <button id="np">Опубликовать</button><p class="err" id="perr"></p></div>
   ${!configured ? noSetup : ''}${err ? `<p class="err">${esc(err)}</p>` : ''}
   ${rows.map(p => `<a class="post" href="#/t/${p.id}"><div class="ava">${esc(p.author[0].toUpperCase())}</div><div><b>${esc(p.title)}</b><p>${esc(p.body)}</p><span class="meta"><span class="tag">${esc(FC[p.category] || 'Общее')}</span>${esc(p.author)} · ${fmt(p.created_at)} · ответов: ${p.comments?.[0]?.count ?? 0}</span></div></a>`).join('') || (configured && !err ? '<p class="lead">Здесь пока пусто. Создай первую тему.</p>' : '')}
  </div><aside>${miniWiki()}</aside></div>`;
  $('#nt').onclick = () => user ? ($('#form').hidden = !$('#form').hidden) : needLogin();
  $('#np').onclick = async () => {
    const title = $('#pt').value.trim(), body = $('#pb').value.trim();
    if(!title || !body) return $('#perr').textContent = 'Заполните заголовок и текст.';
    const {data:p, error:e} = await sb.from('posts').insert({title, body, category:$('#pc').value, user_id:user.id, author:nameOf(user)}).select().single();
    e ? $('#perr').textContent = e.message : location.hash = '#/t/' + p.id;
  };
}

async function thread(id){
  if(!configured) return app.innerHTML = '<h1>Форум</h1>' + noSetup;
  const [{data:p}, {data:cs}] = await Promise.all([
    sb.from('posts').select('*').eq('id', id).maybeSingle(),
    sb.from('comments').select('*').eq('post_id', id).order('created_at')]);
  if(!p) return app.innerHTML = '<h1>Тема не найдена</h1><a href="#/">К форуму</a>';
  const mine = x => user && user.id === x.user_id;
  document.title = p.title + ' — DorsoForum';
  app.innerHTML = `<div class="layout"><div><div class="crumb"><a href="#/">Форум</a> / <a href="#/c/${esc(p.category)}">${esc(FC[p.category] || 'Общее')}</a></div>
   <h1>${esc(p.title)}</h1><p class="meta">${esc(p.author)} · ${fmt(p.created_at)} ${mine(p) ? '· <a href="#" id="dp">удалить тему</a>' : ''}</p>
   <div class="box" style="white-space:pre-wrap">${esc(p.body)}</div>
   <h2>Комментарии (${cs.length})</h2>
   ${cs.map(c => `<div class="post" style="border-left-width:1px;cursor:default"><div class="ava">${esc(c.author[0].toUpperCase())}</div><div><span class="meta">${esc(c.author)} · ${fmt(c.created_at)} ${mine(c) ? `· <a href="#" data-dc="${c.id}">удалить</a>` : ''}</span><div style="white-space:pre-wrap">${esc(c.body)}</div></div></div>`).join('') || '<p class="lead">Комментариев пока нет.</p>'}
   <div class="box"><textarea id="cb" placeholder="Ваш комментарий" maxlength="2000"></textarea><button id="nc">Отправить</button><p class="err" id="cerr"></p></div>
  </div><aside>${miniWiki()}</aside></div>`;
  $('#nc').onclick = async () => {
    if(!user) return needLogin();
    const body = $('#cb').value.trim(); if(!body) return;
    const {error} = await sb.from('comments').insert({post_id:id, body, user_id:user.id, author:nameOf(user)});
    error ? $('#cerr').textContent = error.message : thread(id);
  };
  $('#dp')?.addEventListener('click', async e => { e.preventDefault(); if(confirm('Удалить тему?')){ await sb.from('posts').delete().eq('id', id); location.hash = '#/'; } });
  document.querySelectorAll('[data-dc]').forEach(a => a.addEventListener('click', async e => { e.preventDefault(); await sb.from('comments').delete().eq('id', a.dataset.dc); thread(id); }));
}

/* ----- вики ----- */
const cards = l => l.length ? `<div class="grid">${l.map(a => `<a class="card" href="#/w/${a.id}">${img(a)}<div><b>${esc(a.title)}</b><small>${esc(a.short)}</small></div></a>`).join('')}</div>` : '<p class="lead">Ничего не найдено.</p>';
function wiki(){
  app.innerHTML = '<h1>Вики</h1><p class="lead">Сущности, предметы, обновления и лор.</p>' +
    Object.entries(CATS).map(([k,v]) => `<h2 id="${k}">${v}</h2>${cards(DATA.filter(a => a.cat === k))}`).join('');
}
const cat = k => app.innerHTML = `<div class="crumb"><a href="#/wiki">Вики</a> / ${esc(CATS[k] || '')}</div><h1>${esc(CATS[k] || 'Раздел')}</h1><p class="lead">Статей: ${DATA.filter(a => a.cat === k).length}</p>${cards(DATA.filter(a => a.cat === k))}`;
function search(q){
  const r = DATA.filter(a => (a.title + a.short + a.sec.flat().join(' ')).toLowerCase().includes(q.toLowerCase()));
  app.innerHTML = `<h1>Поиск: ${esc(q)}</h1><p class="lead">Найдено: ${r.length}</p>${cards(r)}`;
}
function article(id){
  const a = DATA.find(x => x.id === id);
  if(!a) return app.innerHTML = '<h1>Статья не найдена</h1><a href="#/wiki">В вики</a>';
  document.title = a.title + ' — DorsoForum';
  const rel = DATA.filter(x => x.cat === a.cat && x.id !== a.id).slice(0,3);
  app.innerHTML = `<div class="crumb"><a href="#/wiki">Вики</a> / <a href="#/cat/${a.cat}">${esc(CATS[a.cat])}</a> / ${esc(a.title)}</div>
  <div class="hero">${img(a)}<div><h1>${esc(a.title)}</h1><span class="meta">${esc(a.short)}</span></div></div>
  <div class="article"><div>${a.sec.map(([h,t],i) => `<h2 id="s${i}" style="margin-top:${i?34:0}px">${esc(h)}</h2><p>${esc(t)}</p>`).join('')}
   ${rel.length ? `<h2>Читайте также</h2>${cards(rel)}` : ''}</div>
  <aside class="side"><div class="infobox"><h3>Кратко</h3>${Object.entries(a.info).map(([k,v]) => `<div><span>${esc(k)}</span>${esc(v)}</div>`).join('')}</div>
   <div class="box toc"><h3>Содержание</h3>${a.sec.map(([h],i) => `<a href="#/w/${a.id}" onclick="document.getElementById('s${i}').scrollIntoView({behavior:'smooth'});return false">${esc(h)}</a>`).join('')}</div></aside></div>`;
}

/* ----- роутер ----- */
function route(){
  document.title = 'DorsoForum';
  const [, a, b] = (location.hash || '#/').slice(1).split('/'), arg = decodeURIComponent(b || '');
  document.querySelectorAll('nav a').forEach(l => l.classList.toggle('on', l.dataset.h === (location.hash || '#/') || (l.dataset.h === '#/wiki' && ['w','search'].includes(a))));
  ({w:article, cat, search, t:thread, c:forum, wiki})[a]?.(arg) ?? forum();
  if(a !== 'w') window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
(async () => {
  if(sb){
    user = (await sb.auth.getSession()).data.session?.user ?? null;
    sb.auth.onAuthStateChange((_e, s) => { user = s?.user ?? null; acct(); if(/^#\/(t|c)?(\/|$)/.test(location.hash||'#/')) route(); });
  }
  acct(); route();
})();
</script>
